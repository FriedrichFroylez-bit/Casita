<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Casita llena deAmor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #4a154b;
            text-align: center;
        }
        h1 {
            color: #ad1457;
            margin-bottom: 5px;
            font-size: 1.8rem;
        }
        p.subtitle {
            color: #880e4f;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 350px;
            width: 100%;
            margin-bottom: 20px;
        }
        #mensaje {
            font-size: 1.1rem;
            font-weight: bold;
            color: #c2185b;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        /* Contenedor de la casita */
        .house-container {
            position: relative;
            width: 200px;
            height: 180px;
            margin: 0 auto 20px auto;
        }
        .part {
            position: absolute;
            opacity: 0;
            transition: all 0.5s ease-in-out;
        }
        .visible {
            opacity: 1 !important;
        }
        
        .base {
            bottom: 0;
            left: 30px;
            width: 140px;
            height: 100px;
            background-color: #ffccbc;
            border: 3px solid #d84315;
            border-radius: 4px;
        }
        .roof {
            top: 20px;
            left: 15px;
            width: 0;
            height: 0;
            border-left: 85px solid transparent;
            border-right: 85px solid transparent;
            border-bottom: 65px solid #c62828;
        }
        .door {
            bottom: 0;
            left: 80px;
            width: 40px;
            height: 60px;
            background-color: #6d4c41;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        .window-left {
            bottom: 35px;
            left: 45px;
            width: 30px;
            height: 30px;
            background-color: #81d4fa;
            border: 2px solid #0288d1;
        }
        .window-right {
            bottom: 35px;
            right: 45px;
            width: 30px;
            height: 30px;
            background-color: #81d4fa;
            border: 2px solid #0288d1;
        }
        .sun {
            top: 0;
            right: 10px;
            width: 35px;
            height: 35px;
            background-color: #ffeb3b;
            border-radius: 50%;
            box-shadow: 0 0 15px #fbc02d;
        }
    
        button {
            background-color: #e91e63;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.4);
            transition: transform 0.1s ease;
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>Construyendo nuestra vida juntos 🏡</h1>
    <p class="subtitle">Toca el botón para ir levantando nuestra casita</p>

    <div class="card">
        <div class="house-container">
            <div id="sun" class="part sun"></div>
            <div id="roof" class="part roof"></div>
            <div id="base" class="part base"></div>
            <div id="window-left" class="part window-left"></div>
            <div id="window-right" class="part window-right"></div>
            <div id="door" class="part door"></div>
        </div>

        <div id="mensaje">¡Toca abajo para empezar a construir! 🧸</div>
        
        <button id="btnSiguiente" onclick="siguientePaso()">Construir un poquito más 🧱</button>
    </div>

    <script>
        const pasos = [
            { id: "base", texto: "1. Colocamos los cimientos firmes: Así de firme quiero que sea nuestra relación, aunque hayan problemas nunca se derrumbe. 🧱" },
            { id: "roof", texto: "2. Construimos el techo: Para hacer un refugio donde podamos sentirnos seguros. 🏠" },
            { id: "window-left", texto: "3. Abrimos la primera ventana: Para mirar el futuro tan hermoso que tendremos. 🪟" },
            { id: "window-right", texto: "4. La segunda ventana: Para poder verte todas las mañanas de mi vida, mi negrita. ✨" },
            { id: "door", texto: "5. Ponemos la puerta: Siempre abierta porque pase lo que pase, siempre te estaré esperando. 🚪" },
            { id: "sun", texto: "Mira, aunque peleemos yo siempre he querido que tú seas mi hogar, mi vida. 🖤" }
        ];

        let pasoActual = -1;

        function siguientePaso() {
            pasoActual++;
            if (pasoActual < pasos.length) {
                let elemento = document.getElementById(pasos[pasoActual].id);
                elemento.classList.add("visible");
                document.getElementById("mensaje").innerText = pasos[pasoActual].texto;
                
                if (pasoActual === pasos.length - 1) {
                    document.getElementById("btnSiguiente").innerText = "¡Casita Terminada! Te Amo 💖";
                    document.getElementById("btnSiguiente").style.backgroundColor = "#4caf50";
                }
            }
        }
    </script>
</body>
</html>
